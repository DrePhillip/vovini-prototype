<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="description" content="Vovini, a working prototype by André Duarte: keep what was said in your 1:1s, notice when the same feedback comes back, and decide what to do before the next one."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 48 48%22%3E%3Crect x=%22-5.5%22 y=%22-5.5%22 width=%2211%22 height=%2242%22 rx=%225.5%22 transform=%22translate(13 9) rotate(-20.77)%22 fill=%22%23633fcc%22/%3E%3Crect x=%22-5.5%22 y=%22-5.5%22 width=%2211%22 height=%2242%22 rx=%225.5%22 transform=%22translate(35 9) rotate(20.77)%22 fill=%22%239786f9%22/%3E%3Ccircle cx=%2224%22 cy=%226.5%22 r=%223.9%22 fill=%22%23ffb64d%22/%3E%3C/svg%3E"><style>[hidden]{display:none!important}</style></head><body><title>Vovini prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{
  --paper:#fbfaff;--ground:#f0eff4;--surface:#ffffff;--surface-2:#faf9fd;--sidebar:#ffffff;
  --line:#e6e4ee;--line-2:#d0d0da;--ink:#181625;--ink-2:#555361;--muted:#868591;--faint:#a9a8b4;
  --iris:#633fcc;--iris-hover:#5433b8;--iris-ink:#ffffff;--iris-soft:#ede8ff;--iris-soft-ink:#55448c;--iris-50:#f6f6ff;--iris-300:#b8b2fc;--iris-500:#7654ea;--iris-deep:#372474;
  --ember:#ffb64d;--ember-soft:#fff6e8;--ember-tint:#ffe6c4;--ember-ink:#944f00;--ember-deep:#6b3900;--ember-rule:#ffd79a;--ember-btn:#944f00;--ember-btn-ink:#ffffff;
  --moss:#007044;--moss-tint:#d0f6df;--moss-soft:#f3fcf7;--danger:#b42318;
  --logo-a:#633fcc;--logo-b:#9786f9;--logo-c:#3f2a9e;--cta-bg:#633fcc;--art-dim:none;
  --w1:#492a9e;--w2:#6a44da;--w3:#8b7be5;--w4:#b2acf0;
  --c-comm-bg:#ede8ff;--c-comm-ink:#55448c;--c-craft-bg:#d3f7e4;--c-craft-ink:#00653e;--c-prod-bg:#d6f0ff;--c-prod-ink:#07558e;
  --c-proc-bg:#f6edcc;--c-proc-ink:#675000;--c-coll-bg:#ffe1e9;--c-coll-ink:#84324a;--c-conf-bg:#ffe5d2;--c-conf-ink:#823c00;
  --sheet-1:#f1f0f7;--sheet-2:#e4e1ee;--scrim:rgba(24,22,37,.38);
  --shadow-1:0 1px 2px rgba(24,22,37,.05),0 8px 24px rgba(24,22,37,.05);
  --shadow-2:0 2px 6px rgba(24,22,37,.07),0 26px 60px rgba(55,36,116,.16);
  --ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.3,1.5,.5,1);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f0d16;--ground:#131119;--surface:#1b1826;--surface-2:#211d2e;--sidebar:#16131f;
    --line:#2c2839;--line-2:#3b3650;--ink:#f3f1fa;--ink-2:#c3bfd2;--muted:#948fa9;--faint:#6f6a82;
    --iris:#7457f0;--iris-hover:#8267ff;--iris-ink:#ffffff;--iris-soft:#2a2346;--iris-soft-ink:#d2c7ff;--iris-50:#1f1a33;--iris-300:#5e4fb0;--iris-500:#9d8bff;--iris-deep:#e2dbff;
    --ember:#ffb64d;--ember-soft:#2a2012;--ember-tint:#3d2b12;--ember-ink:#ffc873;--ember-deep:#ffdca8;--ember-rule:#7a5520;--ember-btn:#ffb64d;--ember-btn-ink:#2a1a05;
    --moss:#6fdcaa;--moss-tint:#12352a;--moss-soft:#12241d;--danger:#ff7a70;
    --logo-a:#8a70ff;--logo-b:#c2b8ff;--logo-c:#5b43d6;--cta-bg:#5a3fd6;--art-dim:brightness(.82) saturate(.92);
    --w1:#d6d0ff;--w2:#a898ff;--w3:#7c68e6;--w4:#5846b0;
    --c-comm-bg:#2b2544;--c-comm-ink:#cfc3ff;--c-craft-bg:#10352a;--c-craft-ink:#7fe0b1;--c-prod-bg:#0f2d44;--c-prod-ink:#94ccf5;
    --c-proc-bg:#33290c;--c-proc-ink:#e6c65c;--c-coll-bg:#3a1d29;--c-coll-ink:#f2a3bd;--c-conf-bg:#3a2413;--c-conf-ink:#f7b27a;
    --sheet-1:#262235;--sheet-2:#2f2a41;--scrim:rgba(0,0,0,.55);
    --shadow-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
    --shadow-2:0 2px 6px rgba(0,0,0,.35),0 26px 60px rgba(0,0,0,.45);
  }
}
:root[data-theme="dark"]{
  --paper:#0f0d16;--ground:#131119;--surface:#1b1826;--surface-2:#211d2e;--sidebar:#16131f;
  --line:#2c2839;--line-2:#3b3650;--ink:#f3f1fa;--ink-2:#c3bfd2;--muted:#948fa9;--faint:#6f6a82;
  --iris:#7457f0;--iris-hover:#8267ff;--iris-ink:#ffffff;--iris-soft:#2a2346;--iris-soft-ink:#d2c7ff;--iris-50:#1f1a33;--iris-300:#5e4fb0;--iris-500:#9d8bff;--iris-deep:#e2dbff;
  --ember:#ffb64d;--ember-soft:#2a2012;--ember-tint:#3d2b12;--ember-ink:#ffc873;--ember-deep:#ffdca8;--ember-rule:#7a5520;--ember-btn:#ffb64d;--ember-btn-ink:#2a1a05;
  --moss:#6fdcaa;--moss-tint:#12352a;--moss-soft:#12241d;--danger:#ff7a70;
  --logo-a:#8a70ff;--logo-b:#c2b8ff;--logo-c:#5b43d6;--cta-bg:#5a3fd6;--art-dim:brightness(.82) saturate(.92);
  --w1:#d6d0ff;--w2:#a898ff;--w3:#7c68e6;--w4:#5846b0;
  --c-comm-bg:#2b2544;--c-comm-ink:#cfc3ff;--c-craft-bg:#10352a;--c-craft-ink:#7fe0b1;--c-prod-bg:#0f2d44;--c-prod-ink:#94ccf5;
  --c-proc-bg:#33290c;--c-proc-ink:#e6c65c;--c-coll-bg:#3a1d29;--c-coll-ink:#f2a3bd;--c-conf-bg:#3a2413;--c-conf-ink:#f7b27a;
  --sheet-1:#262235;--sheet-2:#2f2a41;--scrim:rgba(0,0,0,.55);
  --shadow-1:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  --shadow-2:0 2px 6px rgba(0,0,0,.35),0 26px 60px rgba(0,0,0,.45);
}

*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:'Manrope',ui-sans-serif,system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
body.in-app{background:var(--ground)}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea{font:inherit;color:inherit}
img{max-width:100%;display:block}
:focus-visible{outline:2px solid var(--iris-500);outline-offset:2px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tnum{font-variant-numeric:tabular-nums}
.m0{margin:0}.small{font-size:13px}.muted{color:var(--muted)}.ink2{color:var(--ink-2)}.c-iris{color:var(--iris-500)}
.row{display:flex;align-items:center}.wrap{flex-wrap:wrap}.gap6{gap:6px}.gap8{gap:8px}.gap10{gap:10px}.gap12{gap:12px}.end{justify-content:flex-end}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.grow{flex:1 1 0;min-width:0}.w100{width:100%}
.rule{height:1px;background:var(--line)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.eyebrow.ac{color:var(--iris-500)}
.link{color:var(--iris-500);font-weight:700}.link:hover{color:var(--iris)}
.h1{font-size:clamp(26px,1.6vw + 14px,32px);font-weight:800;letter-spacing:-.03em;line-height:1.12;margin:0;text-wrap:balance}
.h2{font-size:18px;font-weight:700;letter-spacing:-.012em;line-height:1.3;margin:0}
.lede{margin:0;color:var(--muted);font-size:14.5px}
.page-head{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow-1)}
.flat{border-radius:16px;box-shadow:inset 0 0 0 1px var(--line)}

/* brand */
.brand{display:inline-flex;align-items:center;gap:10px}
.brand-lock{display:inline-flex;align-items:center;gap:9px}
.mark{flex:none;overflow:visible}
.mark .arms{transform-origin:24px 44px}
.mark .mdot{transform-box:fill-box;transform-origin:center}
.brand:hover .mdot{animation:dotHop .7s var(--spring)}
.play .mark .arms,.onb .mark .arms{animation:armsIn .9s var(--spring) both}
.play .mark .mdot,.onb .mark .mdot{animation:dotIn .8s .45s var(--spring) both}
@keyframes armsIn{from{transform:scaleY(.15);opacity:0}}
@keyframes dotIn{from{transform:translateY(-14px) scale(.4);opacity:0}}
@keyframes dotHop{40%{transform:translateY(-5px)}}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:44px;padding:0 18px;border-radius:11px;font-size:14px;font-weight:700;white-space:nowrap;flex:none;transition:transform .18s var(--ease),background-color .2s,box-shadow .25s,color .2s;user-select:none;-webkit-user-select:none}
.btn:active{transform:scale(.97)}
.btn-p{background:var(--iris);color:var(--iris-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.16),0 8px 18px -8px rgba(99,63,204,.6)}
.btn-p:hover{background:var(--iris-hover);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),0 12px 24px -8px rgba(99,63,204,.7)}
.btn-s{background:var(--surface);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line-2)}
.btn-s:hover{box-shadow:inset 0 0 0 1px var(--iris-300)}
.btn-g{color:var(--ink-2)}.btn-g:hover{background:var(--iris-50);color:var(--ink)}
.btn-lg{height:52px;padding:0 24px;border-radius:13px;font-size:15px}
.btn-sm{height:36px;padding:0 13px;border-radius:9px;font-size:13px;gap:7px}
.btn[disabled]{opacity:.45;pointer-events:none;box-shadow:none}
.btn-kept{background:var(--moss-tint);color:var(--moss)}
.btn-amber{background:var(--ember-btn);color:var(--ember-btn-ink)}
.btn-amber-g{color:var(--ember-deep)}.btn-amber-g:hover{background:var(--ember-tint)}
.btn-w{background:#fff;color:#4c31a0}.btn-w:hover{background:#f3efff}
.btn-danger{background:var(--danger);color:#fff}
.btn .i{transition:transform .45s var(--spring)}
.btn:hover .i-r{transform:translateX(3px)}
.spark-btn:hover .i{transform:rotate(22deg) scale(1.15)}
.spin{width:16px;height:16px;border-radius:999px;border:2px solid currentColor;border-right-color:transparent;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* chips, badges, fields, avatars */
.chip{--bg:var(--iris-soft);--fg:var(--iris-soft-ink);height:28px;padding:0 11px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;white-space:nowrap;background:var(--bg);color:var(--fg);flex:none}
.chip i{width:7px;height:7px;border-radius:4px;background:currentColor;flex:none}
.chip-sm{height:24px;padding:0 9px;font-size:12px}
.chip b{font-weight:800}
.c-comm{--bg:var(--c-comm-bg);--fg:var(--c-comm-ink)}.c-craft{--bg:var(--c-craft-bg);--fg:var(--c-craft-ink)}.c-prod{--bg:var(--c-prod-bg);--fg:var(--c-prod-ink)}
.c-proc{--bg:var(--c-proc-bg);--fg:var(--c-proc-ink)}.c-coll{--bg:var(--c-coll-bg);--fg:var(--c-coll-ink)}.c-conf{--bg:var(--c-conf-bg);--fg:var(--c-conf-ink)}
.badge{height:26px;padding:0 10px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;white-space:nowrap;flex:none}
.badge.sm{height:22px}
.b-amber{background:var(--ember-tint);color:var(--ember-ink)}.b-green{background:var(--moss-tint);color:var(--moss)}.b-grey{background:var(--ground);color:var(--ink-2)}.b-lav{background:var(--iris-soft);color:var(--iris-soft-ink)}
.field{height:46px;border-radius:11px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:14px;color:var(--ink);transition:box-shadow .2s}
.field b{font-weight:700}.field .muted{font-size:13px}
.fbtn:hover{box-shadow:inset 0 0 0 1px var(--iris-300)}
input.field{width:100%;border:0;outline:0}
input.field::placeholder,textarea::placeholder{color:var(--faint)}
input.field:focus{box-shadow:inset 0 0 0 1.5px var(--iris-500),0 0 0 4px var(--iris-50)}
.av{border-radius:999px;object-fit:cover;flex:none;background:var(--iris-soft)}
.av-i{display:inline-flex;align-items:center;justify-content:center;background:var(--iris);color:#fff;font-weight:800}
.hl{background-image:linear-gradient(var(--bg),var(--bg));background-repeat:no-repeat;background-size:100% 100%;border-radius:6px;padding:1px 3px;-webkit-box-decoration-break:clone;box-decoration-break:clone;transition:background-size .8s cubic-bezier(.65,0,.25,1)}
.status{display:inline-flex;align-items:center;gap:7px;height:26px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--moss-tint);color:var(--moss);transition:background-color .3s,color .3s}
.status i{width:7px;height:7px;border-radius:4px;background:currentColor}
.status.busy{background:var(--iris-soft);color:var(--iris-soft-ink)}
.status.busy i{animation:blink .9s ease-in-out infinite}
@keyframes blink{50%{opacity:.25}}

/* folders */
.fold{--tab:138px;--tab-bg:var(--surface);--tab-ink:var(--ink);--r:16px;position:relative;display:block;padding-top:26px;filter:drop-shadow(0 1px 2px rgba(24,22,37,.06)) drop-shadow(0 10px 22px rgba(24,22,37,.08));transition:transform .4s var(--ease),filter .4s}
.fold-tab{position:absolute;left:0;top:0;width:var(--tab);height:40px;border-radius:12px 12px 0 0;background:var(--tab-bg)}
.fold-fil{position:absolute;top:14px;left:var(--tab);width:12px;height:12px;background:radial-gradient(circle at 100% 0,transparent 11.5px,var(--tab-bg) 12px)}
.fold-lab{position:absolute;left:0;top:0;width:var(--tab);height:26px;display:flex;align-items:center;gap:6px;padding-left:14px;font-size:12.5px;font-weight:700;white-space:nowrap;color:var(--tab-ink)}
.fold-body{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border-radius:0 var(--r) var(--r) var(--r);padding:15px 18px 17px}
.sheet-b{position:absolute;top:48px;border-radius:0 0 14px 14px;transition:transform .45s var(--spring)}
.sheet-b.s2{left:22px;right:22px;bottom:-13px;background:var(--sheet-2)}
.sheet-b.s1{left:11px;right:11px;bottom:-6px;background:var(--sheet-1)}
a.fold:hover{transform:translateY(-4px);filter:drop-shadow(0 2px 5px rgba(24,22,37,.08)) drop-shadow(0 22px 36px rgba(55,36,116,.16))}
a.fold:hover .s1{transform:translateY(4px)}a.fold:hover .s2{transform:translateY(9px)}
.tf{--tab-ink:var(--ember-ink)}
.tf-t{font-size:15px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* app shell */
.app-wrap{container-type:inline-size;width:100%}
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100dvh;background:var(--ground)}
.side{position:sticky;top:0;height:100dvh;display:flex;flex-direction:column;padding:20px 14px 16px;background:var(--sidebar);border-right:1px solid var(--line);overflow-y:auto;view-transition-name:sidebar}
.side .brand{padding:6px 10px 24px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav-i{height:42px;padding:0 12px;border-radius:10px;display:flex;align-items:center;gap:11px;font-size:14px;font-weight:600;color:var(--ink-2);transition:background-color .2s,color .2s}
.nav-i .i{color:var(--muted);transition:color .2s,transform .4s var(--spring)}
.nav-i:hover{background:var(--iris-50);color:var(--ink)}.nav-i:hover .i{transform:scale(1.1)}
.nav-i.on{background:var(--iris-soft);color:var(--iris-soft-ink);font-weight:700}.nav-i.on .i{color:var(--iris-500)}
.nav-n{margin-left:auto;min-width:24px;height:22px;padding:0 7px;border-radius:999px;background:var(--ground);color:var(--ink-2);font-size:11.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
.side-lab{font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--faint);padding:24px 12px 8px}
.thrs{display:flex;flex-direction:column;gap:1px}
.thr{height:36px;padding:0 12px;border-radius:9px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:500;color:var(--ink-2);transition:background-color .2s}
.thr:hover{background:var(--iris-50)}
.thr.on{background:var(--ember-soft);color:var(--ember-deep);font-weight:700}
.thr-dot{width:8px;height:8px;border-radius:4px;background:var(--ember);flex:none;transition:background-color .8s,transform .5s var(--spring)}
.thr.quiet .thr-dot{background:var(--moss);transform:scale(.8)}
.thr-t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thr-n{font-size:12px;font-weight:700;color:var(--ember-ink)}
.next{margin:14px 2px 12px;border-radius:14px;background:var(--iris-soft);padding:13px 14px 14px;display:flex;flex-direction:column;gap:2px;transition:transform .3s var(--ease)}
.next:hover{transform:translateY(-2px)}
.next-k{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--iris-500)}
.next-t{font-size:14px;font-weight:700}
.next-d{font-size:12px;color:var(--iris-soft-ink)}
.next.today{background:var(--iris);color:#fff}.next.today .next-k{color:#d9d2f8}.next.today .next-d{color:#e7e2fb}
.next.bump{animation:bump .7s var(--spring)}
@keyframes bump{35%{transform:scale(1.07)}}
.me{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;color:var(--muted);transition:background-color .2s}
.me:hover,.me.on{background:var(--iris-soft)}
.me-t{display:flex;flex-direction:column;flex:1;min-width:0;color:var(--ink);font-size:13.5px;line-height:1.3}
.me-t small{font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column}
.top{height:72px;display:flex;align-items:center;gap:14px;padding:0 32px;position:sticky;top:0;z-index:5;background:color-mix(in oklab,var(--ground) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.mbrand{display:none}
.search{width:min(380px,100%);height:42px;border-radius:12px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);display:flex;align-items:center;gap:10px;padding:0 10px 0 14px;color:var(--faint);transition:box-shadow .2s}
.search input{border:0;outline:0;background:none;flex:1;min-width:0;font-size:13.5px;color:var(--ink)}
.search:focus-within{box-shadow:inset 0 0 0 1.5px var(--iris-500),0 0 0 4px var(--iris-50)}
kbd{font:inherit;font-size:11px;font-weight:700;height:22px;padding:0 7px;border-radius:6px;background:var(--ground);color:var(--muted);display:flex;align-items:center}
.top-r{margin-left:auto;display:flex;gap:10px;align-items:center}
.mnav{display:none}
.body{padding:2px 32px 110px;display:flex;flex-direction:column;gap:22px}
@container (max-width: 980px){
  .app{grid-template-columns:1fr}
  .side{display:none}
  .mbrand{display:inline-flex}
  .top{padding:0 16px;height:64px}
  .search{flex:1;width:auto}.search kbd{display:none}
  .mnav{display:flex;gap:6px;padding:4px 16px 10px;overflow-x:auto;position:sticky;top:64px;z-index:5;background:color-mix(in oklab,var(--ground) 84%,transparent);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
  .mnav a{height:36px;padding:0 13px;border-radius:999px;display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--ink-2);background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);white-space:nowrap}
  .mnav a.on{background:var(--iris-soft);color:var(--iris-soft-ink);box-shadow:none}
  .body{padding:6px 16px 110px}
}
.frame-screen .app{min-height:900px;height:900px;overflow:hidden}
.frame-screen .side{position:relative;height:900px;view-transition-name:none}
.frame-screen .top,.frame-screen .mnav{position:relative}
.app.anim .body>*{animation:rvIn .7s var(--ease) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rvIn{from{opacity:0;transform:translateY(22px)}}

/* capture */
.cap{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.cap-main{display:flex;flex-direction:column;gap:18px}
.meta-row{display:flex;gap:10px;flex-wrap:wrap}
.meta-row .field{padding-left:10px}
.note-box{border-radius:20px;background:var(--surface);box-shadow:0 0 0 1.5px var(--iris-500),0 0 0 5px var(--iris-50),var(--shadow-1);padding:24px 28px 14px;display:flex;flex-direction:column;gap:10px}
.note-ta{border:0;outline:0;resize:vertical;background:none;font-size:15.5px;line-height:1.7;min-height:300px;width:100%;color:var(--ink)}
.note-foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px;font-size:12.5px}
.saved{display:flex;align-items:center;gap:7px;color:var(--muted)}
.saved i{width:6px;height:6px;border-radius:3px;background:var(--iris-500)}
.saved.pulse i{animation:bump .5s var(--spring)}
.cap-actions{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}
.cap-side{display:flex;flex-direction:column;gap:14px;padding-top:40px}
.side-card{padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.due-t{margin:0;font-size:15px;font-weight:700;line-height:1.4}
.result{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:12px;font-size:13.5px;font-weight:700;animation:rvIn .5s var(--ease) both}
.result.kept{background:var(--moss-tint);color:var(--moss)}
.result.not{background:var(--ground);color:var(--ink-2)}
.result .link{margin-left:auto}
.chk path{stroke-dasharray:1;stroke-dashoffset:0}
.chk.draw path{animation:drawOn .5s .1s cubic-bezier(.65,0,.35,1) both}
@keyframes drawOn{from{stroke-dashoffset:1}}
.ghost-card{background:transparent}
@container (max-width: 1100px){.cap{grid-template-columns:1fr}.cap-side{padding-top:0}}

/* classify */
.back{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:700;color:var(--muted)}
.back:hover{color:var(--ink)}.back:hover .i{transform:translateX(-3px)}.back .i{transition:transform .3s var(--ease)}
.who{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.cls{display:grid;grid-template-columns:minmax(0,1fr) 480px;gap:24px;align-items:start}
.note-read{padding:26px 30px 24px;display:flex;flex-direction:column;gap:14px}
.note-read p{margin:0;font-size:15.5px;line-height:1.78}
.hint{display:flex;gap:8px;align-items:center;font-size:12.5px;color:var(--muted)}
.cls-side{display:flex;flex-direction:column;gap:14px}
.weights{padding:20px 22px 10px;display:flex;flex-direction:column;gap:12px}
.wbar{display:flex;gap:3px;height:10px}
.seg{flex-grow:var(--w);height:10px;border-radius:5px;background:var(--c);transition:flex-grow .8s cubic-bezier(.65,0,.25,1),background-color .3s}
.wlist{list-style:none;margin:0;padding:0}
.wrow{display:flex;flex-direction:column;gap:7px;padding:13px 0 12px;border-top:1px solid var(--line);transition:opacity .45s,transform .6s var(--ease)}
.wrow-top{display:flex;align-items:center;gap:12px}
.sw{width:10px;height:10px;border-radius:3px;flex:none;background:var(--c);transition:background-color .3s}
.trk{margin-left:auto;width:clamp(84px,24%,130px);height:24px;position:relative;cursor:ew-resize;touch-action:none;flex:none}
.trk::before{content:"";position:absolute;left:0;right:0;top:9px;height:6px;border-radius:3px;background:var(--iris-soft)}
.fill{position:absolute;left:0;top:9px;height:6px;border-radius:3px;background:var(--iris);width:calc(var(--w) * 1%);transition:width .8s cubic-bezier(.65,0,.25,1)}
.thumb{position:absolute;top:12px;left:calc(var(--w) * 1%);width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1.5px var(--iris),0 2px 6px rgba(24,22,37,.2);transition:left .8s cubic-bezier(.65,0,.25,1),transform .2s var(--spring)}
.trk:hover .thumb,.trk.drag .thumb,.trk:focus-visible .thumb{transform:scale(1.18)}
.trk.drag .fill,.trk.drag .thumb{transition:none}
.pct{width:44px;text-align:right;font-size:14px;font-weight:800;flex:none}
.x{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:var(--faint);flex:none;transition:background-color .2s,color .2s}
.x:hover{background:var(--ground);color:var(--ink)}
.wq{font-size:12.5px;color:var(--muted);padding-left:22px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wrow.out{opacity:0;transform:translateX(24px)}
.add-wrap{position:relative;padding:4px 0 12px}
.add-cat{width:100%;height:44px;border-radius:12px;box-shadow:inset 0 0 0 1.5px var(--line-2);display:flex;align-items:center;justify-content:center;gap:8px;font-size:13.5px;font-weight:700;color:var(--muted);background-image:none;transition:box-shadow .2s,color .2s}
.add-cat:hover{box-shadow:inset 0 0 0 1.5px var(--iris-300);color:var(--ink)}
.pop{position:absolute;left:0;right:0;bottom:calc(100% - 4px);z-index:10;padding:8px;border-radius:16px;background:var(--surface);box-shadow:var(--shadow-2);display:flex;flex-wrap:wrap;gap:6px;animation:popIn .35s var(--spring) both}
@keyframes popIn{from{opacity:0;transform:translateY(8px) scale(.96)}}
.aha{border-radius:20px;background:var(--ember-soft);padding:18px 20px;display:flex;gap:14px;position:relative;transition:opacity .5s,transform .7s var(--ease)}
.aha-ic{width:40px;height:40px;border-radius:12px;background:var(--ember-tint);color:var(--ember-ink);display:grid;place-items:center;flex:none}
.aha-b{display:flex;flex-direction:column;gap:4px;min-width:0}
.aha-b>b{color:var(--ember-deep);font-size:15.5px}
.aha-b p{margin:0 0 10px;color:var(--ember-ink);font-size:13.5px;line-height:1.5}
.aha-b p strong{color:var(--ember-deep)}
.odo{display:inline-block;height:1.5em;width:var(--o3,auto);overflow:hidden;vertical-align:bottom;font-weight:800;color:var(--ember-deep)}
.odo>span{display:flex;flex-direction:column;align-items:flex-start;transform:translateY(-3em)}
.odo>span>span{height:1.5em;line-height:1.5em}
.reading .hl{background-size:0% 100%}
.reading .hl.lit{background-size:100% 100%}
.reading .wrow{opacity:0;transform:translateY(12px)}
.reading .wrow .fill{width:0}.reading .wrow .thumb{left:0}
.reading .wrow.in{opacity:1;transform:none}
.reading .wrow.in .fill{width:calc(var(--w) * 1%)}.reading .wrow.in .thumb{left:calc(var(--w) * 1%)}
.reading .wbar .seg{flex-grow:.0001}
.reading .wbar.in .seg{flex-grow:var(--w)}
.reading .aha{opacity:0;transform:translateY(18px)}
.reading .aha.in{opacity:1;transform:none;animation:ring 1.6s .3s ease-out}
.reading .odo>span{transform:translateY(0)}
.reading .odo{width:var(--o1,auto)}
.reading .aha.in .odo{animation:odoW 1.1s .45s steps(1,end) both}
@keyframes odoW{0%{width:var(--o1)}33%{width:var(--o2)}66%,100%{width:var(--o3)}}
.reading .aha.in .odo>span{animation:tick 1.1s .45s steps(1,end) both}
@keyframes tick{0%{transform:translateY(0)}33%{transform:translateY(-1.5em)}66%,100%{transform:translateY(-3em)}}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(255,182,77,.55)}100%{box-shadow:0 0 0 22px rgba(255,182,77,0)}}
@container (max-width: 1180px){.cls{grid-template-columns:1fr}}

/* thread */
.crumbs{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--muted);flex-wrap:wrap}
.crumbs a:hover{color:var(--ink)}
.crumbs b{color:var(--ink)}
.title-row{display:flex;align-items:center;gap:8px}
.title-edit{outline:none;border-radius:6px;transition:box-shadow .2s}
.title-edit[contenteditable="true"]{box-shadow:0 2px 0 var(--iris-500);cursor:text}
.icon-btn{width:38px;height:38px;border-radius:10px;display:grid;place-items:center;color:var(--muted);flex:none;transition:background-color .2s,color .2s}
.icon-btn:hover{background:var(--iris-50);color:var(--ink)}
.thr-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.bigfold{--tab:150px;--tab-bg:var(--ember-tint);--tab-ink:var(--ember-ink);filter:drop-shadow(0 2px 5px rgba(24,22,37,.08)) drop-shadow(0 24px 44px rgba(55,36,116,.14))}
.bigfold .fold-body{padding:20px 22px 22px;gap:0}
.sheet{border-radius:14px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);padding:18px 20px 19px;display:flex;flex-direction:column;gap:10px}
.sheet.today{background:var(--ember-soft);box-shadow:inset 0 0 0 1px var(--ember-rule)}
.sheet-top{display:flex;align-items:center;gap:10px}
.sheet-top b{font-size:13.5px;font-weight:800}
.sheet q{font-size:17px;font-weight:600;line-height:1.45;letter-spacing:-.005em}
.sheet.today q{color:var(--ember-deep)}
.gapm{display:flex;align-items:center;gap:10px;padding:12px 0 12px 24px;font-size:12px;font-weight:700;color:var(--faint)}
.gapm span{width:2px;height:16px;border-radius:1px;background:var(--line-2);transform-origin:top}
.anim .bigfold .fold-body{animation:foldOpen .8s var(--ease) both}
@keyframes foldOpen{from{clip-path:inset(0 0 calc(100% - 70px) 0 round 0 16px 16px 16px)}to{clip-path:inset(0 0 0 0 round 0 16px 16px 16px)}}
.anim .sheet{animation:sheetIn .65s var(--ease) both;animation-delay:calc(var(--i) * 170ms + 260ms)}
@keyframes sheetIn{from{opacity:0;transform:translateY(-18px)}}
.anim .gapm span{animation:growY .5s var(--ease) both;animation-delay:calc(var(--i) * 170ms + 450ms)}
@keyframes growY{from{transform:scaleY(0)}}
.commit{padding:22px 24px 24px;display:flex;flex-direction:column;gap:14px}
.commit-ta{width:100%;min-height:104px;resize:none;border:0;outline:0;border-radius:14px;padding:14px 16px;font-size:15.5px;font-weight:600;line-height:1.5;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);color:var(--ink);transition:box-shadow .2s}
.commit-ta:focus{box-shadow:inset 0 0 0 1.5px var(--iris-500),0 0 0 4px var(--iris-50)}
.commit.flash{animation:ring2 1.4s ease-out}
@keyframes ring2{0%{box-shadow:0 0 0 0 rgba(118,84,234,.45),var(--shadow-1)}100%{box-shadow:0 0 0 20px rgba(118,84,234,0),var(--shadow-1)}}
.committed{display:flex;flex-direction:column;gap:12px;animation:rvIn .6s var(--ease) both}
.committed-t{margin:0;font-size:16px;font-weight:700;line-height:1.45}
.ok{width:28px;height:28px;border-radius:9px;background:var(--moss);color:#fff;display:grid;place-items:center;flex:none}
.tried{padding:16px 18px;display:flex;flex-direction:column;gap:11px}
.xbox{width:22px;height:22px;border-radius:7px;background:var(--ground);display:grid;place-items:center;color:var(--muted);flex:none}
.ghost{position:fixed;z-index:90;pointer-events:none;border-radius:14px;padding:14px 16px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;line-height:1.45;box-shadow:var(--shadow-2);overflow:hidden}
@container (max-width: 1180px){.thr-grid{grid-template-columns:1fr}}

/* patterns */
.cat-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:14px}
.catf .fold-body{gap:2px;padding:14px 16px 15px}
.catf .n{font-size:28px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.pat{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:24px;align-items:start}
.chart{padding:20px 24px 18px;display:flex;flex-direction:column;gap:4px}
.crow{display:grid;grid-template-columns:118px minmax(0,1fr) 30px;align-items:center;height:54px}
.crow>span:first-child{font-size:13.5px;font-weight:600}
.crow>span:last-child{text-align:right;font-size:13px;font-weight:700;color:var(--ink-2)}
.cells{position:relative;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));align-items:center;height:54px}
.cell{display:flex;justify-content:center;align-items:center;gap:4px}
.cdot{border-radius:50%;display:block;background:var(--c);position:relative}
.cdot.ring{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ember)}
.crule{position:absolute;top:50%;height:2px;margin-top:-1px;background:var(--ember-rule);left:var(--l);right:var(--r);transform-origin:left}
.anim .cdot{animation:pop .6s var(--spring) both;animation-delay:calc(var(--m) * 90ms + var(--row) * 35ms + 200ms)}
@keyframes pop{from{transform:scale(0)}}
.anim .crule{animation:drawX 1.1s cubic-bezier(.65,0,.25,1) both;animation-delay:1s}
@keyframes drawX{from{transform:scaleX(0)}}
.axis{display:grid;grid-template-columns:118px minmax(0,1fr) 30px;border-top:1px solid var(--line);padding-top:10px}
.axis .cells{height:auto;text-align:center;font-size:12px;font-weight:600;color:var(--muted)}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.tfs{display:flex;flex-direction:column;gap:20px}
.anim .catf,.anim .tfs .fold{animation:rvIn .7s var(--ease) both;animation-delay:calc(var(--i) * 60ms + 80ms)}
@container (max-width: 1180px){.cat-grid{grid-template-columns:repeat(3,minmax(0,1fr))}.pat{grid-template-columns:1fr}}
@container (max-width: 620px){.cat-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.crow,.axis{grid-template-columns:86px minmax(0,1fr) 24px}}

/* history & entry */
.hist-tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.fchips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{height:34px;padding:0 13px;border-radius:999px;font-size:13px;font-weight:700;color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--line-2);background:var(--surface);transition:background-color .25s,color .25s,box-shadow .25s}
.fchip:hover{box-shadow:inset 0 0 0 1px var(--iris-300)}
.fchip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.hlist{padding:6px 10px 10px}
.mon{padding:14px 18px 6px;display:flex;gap:10px;align-items:baseline}
.mon .eyebrow{color:var(--ink)}
.erow{display:grid;grid-template-columns:38px 36px 170px minmax(0,1fr) 104px 18px;align-items:center;gap:16px;padding:12px 18px;border-radius:14px;transition:background-color .2s}
.erow:hover{background:var(--iris-50)}
.erow:hover .chev{transform:translateX(3px);color:var(--ink)}
.chev{color:var(--faint);transition:transform .3s var(--ease),color .2s}
.dd{display:flex;flex-direction:column;align-items:center}
.dd b{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
.dd small{font-size:10.5px;font-weight:700;letter-spacing:.1em;color:var(--faint)}
.e-who b{display:block;font-size:14px}.e-who small{font-size:12.5px;color:var(--muted)}
.e-q{display:flex;flex-direction:column;gap:8px;min-width:0}
.e-q q{font-size:14px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.e-b{display:flex;justify-content:flex-end}
.erow.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,35%{background:var(--iris-soft)}}
.anim .erow{animation:rvIn .6s var(--ease) both;animation-delay:calc(var(--i) * 45ms + 120ms)}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.ent{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:start}
@container (max-width: 980px){.erow{grid-template-columns:34px 32px minmax(0,1fr) 18px;gap:12px;padding:12px 10px}.e-who,.e-b{display:none}}
@container (max-width: 1100px){.ent{grid-template-columns:1fr}}

/* reviews & today */
.rev-top{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;align-items:stretch}
.hero-next{border-radius:24px;background:var(--iris-soft);padding:24px 26px 20px;display:flex;flex-direction:column;gap:18px}
.date-tile{width:92px;flex:none;border-radius:18px;background:var(--surface);padding:12px 0 13px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow-1)}
.date-tile small{font-size:12px;font-weight:800;letter-spacing:.1em;color:var(--iris-500)}
.date-tile b{font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1.05}
.date-tile span{font-size:12px;font-weight:600;color:var(--muted)}
.hn-k{font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--iris-500)}
.hn-t{font-size:clamp(20px,2vw,24px);font-weight:800;letter-spacing:-.024em;margin:2px 0}
.hn-m{font-size:13.5px;color:var(--iris-soft-ink)}
.stats{display:flex;gap:26px;padding-top:10px;flex-wrap:wrap}
.stats div{display:flex;align-items:baseline;gap:8px}.stats b{font-size:22px;font-weight:800}.stats span{font-size:13px;color:var(--iris-soft-ink)}
.hn-foot{display:flex;gap:10px;align-items:center;border-top:1px solid var(--iris-300);padding-top:14px;font-size:13px;color:var(--iris-soft-ink)}
.ccard{padding:17px 20px;display:flex;flex-direction:column;gap:10px}
.ccard-t{display:flex;gap:12px;align-items:flex-start;font-size:15px;font-weight:700;line-height:1.4}
.cbox{width:22px;height:22px;border-radius:7px;box-shadow:inset 0 0 0 1.8px var(--line-2);flex:none;margin-top:1px}
.cfrom{display:flex;gap:7px;align-items:center;padding-left:34px;font-size:12.5px;color:var(--muted)}
.cfrom b{color:var(--ink-2)}
.past{padding:20px 24px 8px}
.prow{display:grid;grid-template-columns:36px 150px minmax(0,1fr) 100px 18px;gap:20px;align-items:start;padding:14px 6px;border-top:1px solid var(--line)}
.plist{display:flex;flex-direction:column;gap:9px}
.pi{display:flex;gap:11px;align-items:flex-start;font-size:14px;line-height:1.4}
.pi.n{color:var(--muted)}
.mk{width:20px;height:20px;border-radius:6px;display:grid;place-items:center;flex:none}
.mk.y{background:var(--moss-tint);color:var(--moss)}.mk.n{background:var(--ground);color:var(--muted)}
.p-lab{text-align:right;font-size:12.5px;font-weight:700;color:var(--ink-2);line-height:20px}
.today-grid{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:24px;align-items:start}
.promises{padding:22px 26px 8px}
.promise{padding:18px 0 20px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:11px}
.promise-t{margin:0;font-size:16.5px;font-weight:700;line-height:1.4;transition:color .4s}
.promise.kept .promise-t{color:var(--moss)}
.seg2{position:relative;display:inline-grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--ground);align-self:flex-start}
.seg2 button{position:relative;z-index:1;height:36px;padding:0 16px;border-radius:9px;font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;justify-content:center;gap:7px;transition:color .3s}
.seg2 .st{position:absolute;z-index:0;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:9px;background:var(--surface);box-shadow:0 1px 3px rgba(24,22,37,.14);opacity:0;transition:transform .5s var(--spring),opacity .2s}
.seg2[data-v="kept"] .st{opacity:1;transform:translateX(0)}
.seg2[data-v="not"] .st{opacity:1;transform:translateX(100%)}
.seg2[data-v="kept"] [data-set="kept"]{color:var(--moss)}
.seg2[data-v="not"] [data-set="not"]{color:var(--ink)}
.why{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.why>div{overflow:hidden}
.promise.not .why{grid-template-rows:1fr}
.why label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);padding:6px 0 7px}
.why textarea{width:100%;min-height:78px;resize:vertical;border:0;outline:0;border-radius:12px;padding:12px 14px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line-2);font-size:14px;line-height:1.5;color:var(--ink)}
.why textarea:focus{box-shadow:inset 0 0 0 1.5px var(--iris-500),0 0 0 4px var(--iris-50)}
.mini-e{display:grid;grid-template-columns:48px 28px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.mini-e small{font-size:12px;font-weight:700;color:var(--muted)}
.mini-e q{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-e span.s{font-size:11.5px;color:var(--faint)}

@container (max-width: 1100px){.set-grid{grid-template-columns:1fr}}

.cta-kept{position:absolute;left:18px;bottom:18px;max-width:calc(100% - 36px);display:flex;gap:12px;align-items:flex-start;padding:14px 16px;border-radius:18px;background:var(--surface);color:var(--ink);box-shadow:var(--shadow-2);transition:transform .9s .5s var(--ease),opacity .9s .5s}
.cta-kept b{display:block;font-size:14px;line-height:1.35}.cta-kept small{font-size:12px;color:var(--muted)}

.l-foot{max-width:1320px;margin:0 auto;padding:28px max(16px,4vw) 110px;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted)}

.rv-wait{opacity:0;transform:translateY(34px)}
.rv-in{animation:rvIn .95s var(--ease) both;animation-delay:calc(var(--d,0) * 1ms)}
@media (max-width: 900px){

  .hero{grid-template-columns:1fr}.hero-art{height:520px}.hero-photo{width:82%}
  .same{height:auto}.same-pin{position:relative;height:auto;grid-template-columns:1fr;padding-block:80px}

}

const ROUTES = [
  ['Outside the app', [['landing', 'Landing page'], ['signup', 'Sign up'], ['login', 'Log in']]],
  ['First run', [['start-calendar', 'Connect your calendar'], ['start-1on1', 'Pick your 1:1'], ['start-note', 'First note']]],

];
const labelOf = name => { for (const [, list] of ROUTES) for (const [k, l] of list) if (k === name) return l; return name === 'entry' ? 'Entry' : 'Landing page'; };
function parse() {
  const raw = location.hash.replace(/^#\/?/, '');
  const [path, query = ''] = raw.split('?');
  const [name, param] = path.split('/');
  return { name: V[name] ? name : 'landing', param, query };
}
function render(first) {
  const { name, param, query } = parse();
  const view = V[name];
  const swap = () => {
    clearRoute();
    markN = 0;
    document.body.classList.toggle('in-app', !!view.app);
    root.innerHTML = view.html(param, query);
    window.scrollTo(0, 0);
    view.mount && view.mount(root, param, query);
    $('#proto-here').textContent = labelOf(name);
    $('#proto-menu').hidden = true; $('#proto-toggle').setAttribute('aria-expanded', 'false');
  };
  if (!first && document.startViewTransition && !reduce) { const vt = document.startViewTransition(swap); vt.ready.catch(() => {}); vt.finished.catch(() => {}); }
  else swap();
}
function buildMenu() {
  const { name } = parse();
  $('#proto-menu').innerHTML = ROUTES.map(([h, list]) => `<h4>${h}</h4>` + list.map(([k, l]) => `<a href="#/${k}" class="${k === name ? 'on' : ''}">${l}<small>/${k === 'landing' ? '' : k}</small></a>`).join('')).join('');
}
$('#proto-toggle').addEventListener('click', e => {
  e.stopPropagation(); const m = $('#proto-menu');
  if (m.hidden) buildMenu();
  m.hidden = !m.hidden; e.currentTarget.setAttribute('aria-expanded', String(!m.hidden));
});
document.addEventListener('click', e => {
  const m = $('#proto-menu'); if (!m.hidden && !e.target.closest('.proto')) { m.hidden = true; $('#proto-toggle').setAttribute('aria-expanded', 'false'); }
  const t = e.target.closest('[data-toast]');

});
